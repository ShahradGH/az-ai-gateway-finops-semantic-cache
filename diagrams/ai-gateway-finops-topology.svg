  <rect x="963" y="630" width="220" height="24" rx="4" fill="#f59e0b"/>
  <text x="975" y="647" class="badge">CACHE MISS ~ 450 ms p95</text>

  <!-- Chargeback Classifier -->
  <rect x="525" y="730" width="790" height="210" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="548" y="764" class="box-title">AI Subcomponent: Semantic Cache Evaluator &amp; Token Chargeback Classifier</text>
  <text x="548" y="790" class="mono">ai/Invoke-SemanticCacheEvaluator.ps1 | ai/Invoke-TokenChargebackClassifier.ps1</text>
  <text x="548" y="822" class="box-sub">• Computes net backend TPM (ObservedTPM - CacheSavedTPM) against AllocatedTpmQuota</text>
  <text x="548" y="848" class="box-sub">• Triggers ALERT_FINOPS_QUOTA_APPROACHING (&gt;= 85% burn) or THROTTLE_429_AND_SPILLOVER_PAYGO (&gt;= 100%)</text>
  <text x="548" y="874" class="box-sub">• Enforces zero-leak cache-poisoning quarantine on instruction-override prompts</text>

