  <text x="1448" y="630" class="mono">queries/Apim-SemanticCache-FinOps.kql</text>
  <text x="1448" y="664" class="box-sub">Aggregates 15-min bins by TenantBU:</text>
  <text x="1448" y="694" class="mono">• CacheHitRatioPct</text>
  <text x="1448" y="720" class="mono">• Throttled429 Count</text>
  <text x="1448" y="746" class="mono">• AvgBackendLatencyMs</text>
  <rect x="1448" y="810" width="225" height="24" rx="4" fill="#10b981"/>
