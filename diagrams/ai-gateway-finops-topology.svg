  <text x="548" y="572" class="mono">contoso-retail-support::kb-v4</text>
  <text x="548" y="598" class="mono">contoso-engineering-copilot::dev-v1</text>
  <rect x="548" y="630" width="210" height="24" rx="4" fill="#10b981"/>
